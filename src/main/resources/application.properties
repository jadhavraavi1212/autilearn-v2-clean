# ============================================================
# AutiLearn - Application Configuration
# ============================================================

server.port=8080

# ============================================================
# DATABASE — Change password to YOUR MySQL root password
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/autilearn_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# RAZORPAY — Get keys from https://dashboard.razorpay.com/app/keys
# Replace with your actual keys to enable live payments.
# Leave as-is to run in demo/test mode.
# ============================================================
razorpay.key.id=YOUR_RAZORPAY_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_KEY_SECRET

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true

spring.application.name=AutiLearn

# Logging
logging.level.com.autilearn=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
